spring:
  application:
    name: telemed-backend
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/telemed}
    username: ${DB_USERNAME:telemed}
    password: ${DB_PASSWORD:telemed}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

telemed:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-a-long-random-value-at-least-32-bytes}
    access-expiration-ms: 3600000
    refresh-expiration-ms: 604800000
  cors:
    origins: ${CORS_ORIGINS:http://localhost:4200}