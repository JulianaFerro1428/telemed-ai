<div class="auth-page">
  <div class="auth-visual">
    <a routerLink="/" class="auth-brand">
      <img src="assets/images/logo.svg" alt="Logo">TeleMed <b>IA</b>
    </a>
    <div>
      <span class="eyebrow">NUEVA CONTRASEÑA</span>
      <h1>Vuelve a entrar con seguridad.</h1>
      <p>Usa el token de recuperación generado por el backend y define una nueva contraseña.</p>
    </div>
  </div>

  <div class="auth-panel">
    <div class="form-card card">
      <span class="eyebrow">RESTABLECER</span>
      <h2>Nueva contraseña</h2>
      <p>Ingresa el token y tu nueva contraseña.</p>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <ion-item>
          <ion-input
            label="Token de recuperación"
            labelPlacement="stacked"
            formControlName="token"
          ></ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            label="Nueva contraseña"
            labelPlacement="stacked"
            type="password"
            formControlName="newPassword"
          ></ion-input>
        </ion-item>

        <ion-button
          expand="block"
          class="btn-primary submit"
          type="submit"
          [disabled]="loading"
        >
          {{ loading ? 'Guardando...' : 'Restablecer contraseña' }}
        </ion-button>
      </form>

      <ion-button
        expand="block"
        fill="outline"
        class="btn-outline"
        routerLink="/login"
      >
        Volver al login
      </ion-button>
    </div>
  </div>
</div>
